name: CI/CD Pipeline

on:
  push:
    branches:
      - test-branch

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_REPO: isl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Retrieve Latest Docker Tag
        id: latest_tag
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
          -X POST \
          -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${{ secrets.DOCKER_PASSWORD }}\"}" \
          https://hub.docker.com/v2/users/login/ | jq -r .token)

          latest_tag=$(curl -s \
          -H "Authorization: Bearer $TOKEN" \
          "https://registry.hub.docker.com/v2/repositories/${DOCKER_USERNAME}/${DOCKER_REPO}/tags?page_size=100" \
          | jq -r '[.results[].name | select(test("^v[0-9]+$")) | sub("^v";"") | tonumber] | max')

          if [ "$latest_tag" = "null" ]; then
            latest_tag=0
          fi

          echo "latest_tag=v$latest_tag" >> $GITHUB_OUTPUT

      - name: Increment Version
        id: increment
        run: |
          number=$(echo "${{ steps.latest_tag.outputs.latest_tag }}" | grep -oE '[0-9]+')
          new_number=$((number + 1))
          echo "new_version=v$new_number" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build -t ${DOCKER_USERNAME}/${DOCKER_REPO}:${{ steps.increment.outputs.new_version }} .

      - name: Push Docker Image
        run: |
          docker push ${DOCKER_USERNAME}/${DOCKER_REPO}:${{ steps.increment.outputs.new_version }}
